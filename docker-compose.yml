  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu,graphics,compute,utility]
  #   runtime: "nvidia"
  #   volumes:
  #     - '/etc/vulkan/icd.d/nvidia_icd.json:/etc/vulkan/icd.d/nvidia_icd.json'
  #     - '/etc/vulkan/implicit_layer.d/nvidia_layers.json:/etc/vulkan/implicit_layer.d/nvidia_layers.json'
  #     - '/usr/share/glvnd/egl_vendor.d/10_nvidia.json:/usr/share/glvnd/egl_vendor.d/10_nvidia.json'
  #   devices:
  #     - /dev/dri:/dev/dri

volumes:
  runstore:
    #A fixed name, so every deploy finds the same runs whatever the project is called. To put the
    #runs on a larger disk, bind it to a host directory writable by uid 61000 or gid 1001:
    #  driver: local
    #  driver_opts: { type: none, o: bind, device: /path/on/the/large/disk }
    name: agroeco-runstore
