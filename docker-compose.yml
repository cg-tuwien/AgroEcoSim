#The project name, fixed. Compose otherwise takes it from the folder this file sits in, and the volume
#below is named after the project - so unpacking each AgroEcoSim-<timestamp>.zip into a folder of its
#own gave every deploy a new, empty run store, and the old runs seemed to vanish. (Compose v2.)
name: agroeco
services:
  simulation:
    image: agroecosim
    ports:
      #host:container. The container listens on 7215 (AGRO_ListenAnyIP + the default port), so the
      #right-hand side is 7215 - it was 80, where nothing has ever listened, which made the service
      #unreachable from the host no matter what the server was doing.
      - "7215:7215"
    restart: on-failure
    group_add:
      - "1001"
    volumes:
      #Stored simulation runs. Without this the frames live in the container's writable layer:
      #lost on every restart, and unbounded against the host disk rather than against the store's
      #own retention budget.
      - runstore:/data/AgroEcoStorage
    environment:
      #Where the store writes. It MUST be inside the volume mounted just above. It was /data/runstore
      #while the volume was mounted here, so the runs went to an anonymous volume on the host's root
      #disk instead, which filled at 56 GB. The server now logs a warning in the Runs tab whenever a
      #volume is mounted next to the store rather than under it.
      - AGRO_RunStoreRoot=/data/AgroEcoStorage/runstore
      #Total bytes of stored runs to keep before whole runs are evicted, oldest first. 1 TiB.
      #
      #A production figure, not a safe one: a ten month run of a green facade is hundreds of
      #gigabytes, so the previous 64 GiB evicted last month's work to make room for this week's.
      #Set it to what the VOLUME can actually hold - about 80 % of it - since eviction is the only
      #thing that frees space without anyone deleting runs by hand. The Runs tab warns when this is
      #more than the volume can hold.
      - AGRO_RunStoreRetentionBytes=1099511627776
      #Free space kept on the volume, in bytes; 2 GiB by default. A run that reaches it is stopped
      #cleanly with a final checkpoint and can be resumed once there is room - it no longer fills
      #the disk. 0 turns the guard off.
      #- AGRO_RunStoreMinFreeBytes=2147483648
      #Store a frame every Nth step. 1 stores every timestep, which makes the stored run complete
      #and costs the most: each stored frame is an export the simulation thread waits for, about
      #two thirds of a simulation step at 1,600 plants. Raise it on a large stand where total wall
      #time matters more than per-step granularity; the last step is always stored.
      #- AGRO_RunStoreFrameStride=1
      #How long a run keeps computing with no browser attached, in minutes; 5 by default. 0 never
      #stops it, which is what a run of several hours needs when the laptop that started it is
      #closed. The run can still be stopped by opening it again and aborting it.
      #- AGRO_UnwatchedGraceMinutes=5
      #How often the store enforces its budgets, in minutes. 0 turns periodic maintenance off, and
      #then the budget is enforced only when a run starts or is deleted - on a host that uploads and
      #browses more than it simulates, that is never.
      #- AGRO_RunStoreSweepMinutes=30
      #How often the live world is written down so a run can be RESUMED rather than recomputed.
      #Every step would double the I/O of a large run for a file only the last copy of which is ever
      #read; 32 bounds what an interrupted run throws away to about a day of simulated time at four
      #hours a tick. A checkpoint is ~19 KB per plant, so a 4,000 plant stand is a few hundred MB.
      #- AGRO_RunStoreCheckpointStride=32
      #Total bytes of uploaded field models to keep. Their own budget, not a share of the run
      #retention: evicting a run does not release its model, which outlives it and may be shared.
      #- AGRO_RunStoreModelBytes=8589934592
      #How long an unreferenced field model is kept. A model is stored at UPLOAD, before any run
      #refers to it, so this must comfortably exceed the time between picking a file and pressing
      #Simulate. A 15 minute floor applies regardless.
      #- AGRO_RunStoreModelGraceHours=6
  # mitsuba:
  #  image: agroecorender
  #  expose:
  #    - "9001"
  #  restart: on-failure
  web:
    image: agroecoweb
    ports:
      - "8080:8080"
    restart: on-failure
